<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>회원가입 / 로그인</title>
  </head>
  <body>
    <h2>회원가입</h2>
    <input type="text" id="signup-id" placeholder="아이디" /><br />
    <input type="password" id="signup-password" placeholder="비밀번호" /><br />
    <button onclick="signup()">회원가입</button>

    <h2>로그인</h2>
    <input type="text" id="login-id" placeholder="아이디" /><br />
    <input type="password" id="login-password" placeholder="비밀번호" /><br />
    <button onclick="login()">로그인</button>

    <script src="script.js"></script>
  </body>
</html>
